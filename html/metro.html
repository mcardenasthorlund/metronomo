        <div class="modal-body">
          ¿Seguro que quieres eliminar este ritmo propio?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" onclick="objCompas.confirmarEliminacion()"><i
