<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metrónomo Flamenco</title>

  <!-- Opciones para PWA -->
  <!-- Manifiesto -->
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Index JS-->
  <script src="/app.js"></script>
  <!-- Fin Opciones para PWA -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <!-- Etiquetas Meta -->
  <meta name="title" content="Metrónomo Flamenco" />
  <meta name="description" content="Metrónomo Flamenco. App para el Metronomo Flamenco" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://metroapp.ideasypruebas2.es/index.html" />
  <meta property="og:title" content="Metrónomo Flamenco" />
  <meta property="og:description" content="Metrónomo Flamenco. App para el Metronomo Flamenco" />
  <meta property="og:image" content="https://metroapp.ideasypruebas2.es/assets/img/logo.png" />
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://metroapp.ideasypruebas2.es/index.html" />
  <meta property="twitter:title" content="Metrónomo Flamenco" />
  <meta property="twitter:description" content="Metrónomo Flamenco. App para el Metronomo Flamenco" />
  <meta property="twitter:image" content="https://metroapp.ideasypruebas2.es/assets/img/logo.png" />

  <!-- Bootstrap CSS  -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Fontawesome -->
  <link rel="stylesheet" href="/assets/fontawesome/css/fontawesome.css">
  <link rel="stylesheet" href="/assets/fontawesome/css/brands.css">
  <link rel="stylesheet" href="/assets/fontawesome/css/solid.css">

  <!-- Estilo -->
  <link rel="stylesheet" href="/assets/css/modern.css">

  <!-- Tipografia -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,200;1,200&family=Nunito:wght@300&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet">

  <!-- Componentes -->
  <script src="/assets/components/components.js" type="module" defer></script>

  <style>
    .tiempo-acento {
      min-width: 42px;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .tiempo-acento.acento-activo {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #fff;
    }
    .ojo {
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--muted);
    }
    .ojo.ojo-vis {
      color: var(--color-accent);
    }
  </style>

  <!-- Javascript -->
  <script src="/assets/js/editor.js"></script>
  <script>
    let objEditor;
    document.addEventListener('DOMContentLoaded', () => {
      objEditor = new Editor();
      objEditor.init();
    })
  </script>
</head>

<body>

  <div class="container text-center pt-5 contenedor">

    <app-cabecera titulo="Ritmo propio" descripcion="Define tu propio compás"></app-cabecera>

    <div class="card tarjeta p-3 mt-3">
      <div class="row g-3 mb-3" style="gap: 0;">
        <div class="col-6">
          <div class="form-floating text-start">
            <input type="text" class="form-control" id="txtNombre" placeholder="Nombre">
            <label for="txtNombre">Nombre</label>
          </div>
        </div>
        <div class="col-6">
          <div class="form-floating text-start">
            <input type="number" class="form-control" id="nudTiempos" value="4" min="1" max="24"
              onchange="objEditor.actualizarTiempos()">
            <label for="nudTiempos">Número de tiempos</label>
          </div>
        </div>
      </div>

      <label for="rngVelocidad" class="form-label text-start w-100">Velocidad por defecto: <span
          id="sp-velocidad">100</span> BPM</label>
      <input type="range" class="form-range" min="70" max="300" step="10" value="100" id="rngVelocidad"
        oninput="document.getElementById('sp-velocidad').innerHTML = this.value">

      <div class="form-floating text-start mt-3">
        <input type="number" class="form-control" id="txtVertical" placeholder="Vertical" min="1" max="24">
        <label for="txtVertical">Número en la vertical del reloj (12)</label>
      </div>

      <hr>

      <div class="row fw-bold mb-2" style="gap: 0;">
        <div class="col-6 text-start"></div>
        <div class="col-3">Palma</div>
        <div class="col-3">Contra</div>
      </div>
      <div id="grid-palmas"></div>
    </div>

    <div class="mt-3">
      <button type="button" class="btn btn-success boton" onclick="objEditor.guardar()"><i class="bi bi-check2-circle"></i>
        Guardar</button>
      <button type="button" class="btn btn-secondary boton" onclick="history.back()"><i class="bi bi-chevron-left"></i>
        Volver</button>
    </div>

    <app-pie></app-pie>
  </div>

</body>

</html>
